name: Item UOM + Store Description Fix

# Fills Units of Measure (Units Type + Stock/Purchase/Sale Unit), Weight Unit,
# and Store Description on every matrix item missing them -- copying the UOM from
# a reference item that already has them, and Store Description from each item's
# own sales description. Diff-aware + id-chunked. Writes only when DRY_RUN=false.

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = report only)"
        required: true
        default: "true"
      max_items:
        description: "Cap on item writes (0 = no cap)"
        required: false
        default: "50"
      reference_id:
        description: "Reference item id to copy UOM from (blank = auto-pick)"
        required: false
        default: ""
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".item-uom-fix-trigger"]

# All NetSuite item-writers share one concurrency group so they QUEUE
# instead of running at once -- the sandbox throttles hard (429s) when
# multiple writers overlap. cancel-in-progress:false = wait, don't kill.
concurrency:
  group: netsuite-writes
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Resolve run parameters (inputs, or trigger file on push)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            get() { grep -E "^$1=" .item-uom-fix-trigger | tail -1 | cut -d= -f2- | tr -d ' \r'; }
            DRY_RUN=$(get DRY_RUN); MAX_ITEMS=$(get MAX_ITEMS); REF=$(get UOM_REFERENCE_ID)
          else
            DRY_RUN="${{ github.event.inputs.dry_run }}"; MAX_ITEMS="${{ github.event.inputs.max_items }}"
            REF="${{ github.event.inputs.reference_id }}"
          fi
          [ "$DRY_RUN" = "false" ] || DRY_RUN="true"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "MAX_ITEMS=${MAX_ITEMS:-50}" >> "$GITHUB_ENV"
          echo "UOM_REFERENCE_ID=${REF}" >> "$GITHUB_ENV"
          echo "Resolved: dry_run=$DRY_RUN max_items=${MAX_ITEMS:-50} ref=${REF:-auto}"
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=${DRY_RUN}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py
      - name: Run UOM + store-description fix
        env:
          UPDATE_MAX_ITEMS: ${{ env.MAX_ITEMS }}
          UOM_REFERENCE_ID: ${{ env.UOM_REFERENCE_ID }}
        run: python scripts/item_uom_fix.py
      - name: Open issue on failure
        if: failure()
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Workflow failed: ${{ github.workflow }}\",\"body\":\"Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
