name: SanMar Sample Mapping (read-only)

# Emits a sample of SanMar feed items and the NetSuite field each value maps to,
# for review before trusting a live run. Reads SanMar's SFTP feed only -- it
# never touches NetSuite -- so it stays out of the netsuite-writes concurrency
# group and is safe to run at any time.

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: "How many items to sample (one per style)"
        required: false
        default: "25"

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          SANMAR_SFTP_USERNAME=${{ secrets.SANMAR_SFTP_USERNAME }}
          SANMAR_SFTP_PASSWORD=${{ secrets.SANMAR_SFTP_PASSWORD }}
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=true
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2

      - name: Build sample mapping
        env:
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size }}
        run: python scripts/sanmar_sample_mapping.py

      # Also echo both CSVs into the log. Artifact zips are served from Azure
      # blob storage, which some networks block, so the log is the copy that is
      # always reachable.
      - name: Print sample to log
        run: |
          echo "===== data/sanmar_sample_mapping.csv ====="
          cat data/sanmar_sample_mapping.csv
          echo ""
          echo "===== data/sanmar_sample_items.csv ====="
          cat data/sanmar_sample_items.csv

      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: sanmar-sample-${{ github.run_id }}
          path: |
            data/sanmar_sample_items.csv
            data/sanmar_sample_mapping.csv
          if-no-files-found: error
