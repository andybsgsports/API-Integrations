name: Momentec Reconcile Report (read-only)

on:
  workflow_dispatch:
    inputs:
      style_limit:
        description: "Only check the first N styles (0 = all)"
        required: false
        default: "0"
      create_preview:
        description: "true = also report what Momentec item creation would add (dry run, writes nothing)"
        required: false
        default: "false"
      create_max_styles:
        description: "Create preview: cap on new styles reported (0 = all)"
        required: false
        default: "0"
      create_styles:
        description: "Create preview: comma-separated style numbers to limit to (blank = all)"
        required: false
        default: ""
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".momentec-reconcile-trigger"]

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=true
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2

      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py

      - name: Run Momentec reconciliation (read-only)
        env:
          RECONCILE_STYLE_LIMIT: ${{ github.event.inputs.style_limit || '0' }}
        run: python scripts/momentec_reconcile.py

      - name: Preview Momentec item creation (dry run, read-only)
        if: github.event.inputs.create_preview == 'true'
        env:
          # Forced here as well as in .env: the client refuses any request
          # that could change NetSuite before it is sent.
          SYNC_DRY_RUN: "true"
          NETSUITE_READ_ONLY: "true"
          CREATE_MAX_STYLES: ${{ github.event.inputs.create_max_styles || '0' }}
          MOMENTEC_CREATE_STYLES: ${{ github.event.inputs.create_styles }}
        run: python scripts/vendor_pipeline.py --vendor momentec --phases create

      - name: Upload mapping CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentec-reconcile-${{ github.run_id }}
          path: data/*.csv
          retention-days: 14
          if-no-files-found: ignore
