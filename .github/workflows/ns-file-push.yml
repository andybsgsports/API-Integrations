name: NetSuite File Cabinet Push (deploys storefront code)

# Pushes edited files under suitescript/store/ back into the File Cabinet via
# SOAP update -- this DEPLOYS storefront code to the NetSuite account the
# repo secrets point at (the sandbox). Each update is verified by re-fetching
# and byte-comparing; the pre-edit originals live in git history (committed by
# the fetch workflow before editing began).
#
# Explicit-list only: the `files` input names every file to push. Nothing is
# deployed implicitly.

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Comma-separated paths relative to suitescript/store/ to push"
        required: true
      script_id:
        description: "Script record internal id anchoring the target folder"
        required: false
        default: "2358"

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=true
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2

      - name: Push files to File Cabinet
        env:
          FILE_PUSH_SCRIPT_ID: ${{ github.event.inputs.script_id }}
          FILE_PUSH_FILES: ${{ github.event.inputs.files }}
        run: python scripts/ns_file_push.py
