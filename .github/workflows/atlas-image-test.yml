name: Atlas Image Field Test (single item)

on:
  workflow_dispatch:
    inputs:
      itemid:
        description: "Item Name/Number to test against"
        required: false
        default: "PC450-White-Small"
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".atlas-image-test-trigger"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          SANMAR_SFTP_USERNAME=${{ secrets.SANMAR_SFTP_USERNAME }}
          SANMAR_SFTP_PASSWORD=${{ secrets.SANMAR_SFTP_PASSWORD }}
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=true
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2

      - name: Find an image upload folder
        run: |
          set -o pipefail
          python scripts/ns_folder_probe.py | tee folder_probe.txt

      - name: Extract folder id into env
        run: |
          fid=$(grep -oE "id [0-9]+" folder_probe.txt | tail -1 | awk '{print $2}')
          echo "NETSUITE_IMAGE_FOLDER_ID=$fid" >> "$GITHUB_ENV"
          echo "resolved folder id: $fid"

      - name: Test custitem_atlas_item_image (single reversible write)
        env:
          ATLAS_TEST_ITEMID: ${{ github.event.inputs.itemid || 'PC450-White-Small' }}
          NETSUITE_IMAGE_FOLDER_ID: ${{ env.NETSUITE_IMAGE_FOLDER_ID }}
        run: python scripts/atlas_image_test.py
