name: UOM Write Test (one item)

# Finds the PATCH shape that switches one item to Pair, after the bulk fix's
# single-body shape was rejected. Writes to ONE genuine bottom (ends up Pair,
# no cleanup). In the write group so it can't collide.

permissions:
  contents: read
  issues: write

concurrency:
  group: netsuite-writes
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: "Item internal id to experiment on"
        required: false
        default: "30251"
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".uom-write-test-trigger"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Resolve params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ITEM_ID=$(grep -E "^ITEM_ID=" .uom-write-test-trigger | tail -1 | cut -d= -f2- | tr -d ' \r')
          else
            ITEM_ID="${{ github.event.inputs.item_id }}"
          fi
          echo "ITEM_ID=${ITEM_ID:-30251}" >> "$GITHUB_ENV"
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=false
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py
      - name: Run one-item UOM write test
        env:
          ITEM_ID: ${{ env.ITEM_ID }}
        run: python scripts/uom_write_test.py
