name: Color Reactivate (list-value write)

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      colors:
        description: "Comma-separated colour name(s) to reactivate (exact name, case-insensitive)"
        required: true
      dry_run:
        description: "Dry run (true = report only)"
        required: true
        default: "true"

# All NetSuite writers share one concurrency group so they QUEUE instead of
# running at once -- the sandbox throttles hard (429s) when writers overlap.
concurrency:
  group: netsuite-writes
  cancel-in-progress: false

jobs:
  reactivate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write .env from repo secrets
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          [ "$DRY_RUN" = "false" ] || DRY_RUN="true"
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=${DRY_RUN}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2

      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py

      - name: Reactivate colour value(s)
        env:
          COLOR_NAMES: ${{ github.event.inputs.colors }}
        run: python scripts/color_reactivate.py
