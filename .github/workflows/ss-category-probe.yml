name: S&S Category Probe (read-only)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:

# Deliberately NOT in the netsuite-writes concurrency group: this reads the
# catalogue and writes nothing. Sharing the writers' group cost it a run --
# GitHub keeps only ONE pending run per group, so when the nightly chain
# dispatched its next leg, the queued preview was cancelled outright
# (2026-08-10, run 31420060870).

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          SS_API_ACCOUNT_NUMBER=${{ secrets.SS_API_ACCOUNT_NUMBER }}
          SS_API_KEY=${{ secrets.SS_API_KEY }}
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=true
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2

      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py

      - name: Probe where S&S keeps the category
        run: python scripts/ss_category_probe.py
