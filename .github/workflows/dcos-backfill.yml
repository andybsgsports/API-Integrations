name: DCOS Supplier Backfill (Champro/USB/TCK)

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      supplier:
        description: "Supplier key (champro, usb, tck)"
        required: true
        default: "champro"
      dry_run:
        description: "Dry run (true = report only)"
        required: true
        default: "true"
      max_items:
        description: "Cap on item writes (0 = no cap)"
        required: false
        default: "25"
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".dcos-backfill-trigger"]

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Resolve run parameters
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            get() { grep -E "^$1=" .dcos-backfill-trigger | tail -1 | cut -d= -f2- | tr -d ' \r'; }
            SUPPLIER=$(get SUPPLIER); DRY_RUN=$(get DRY_RUN); MAX_ITEMS=$(get MAX_ITEMS)
          else
            SUPPLIER="${{ github.event.inputs.supplier }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            MAX_ITEMS="${{ github.event.inputs.max_items }}"
          fi
          [ "$DRY_RUN" = "false" ] || DRY_RUN="true"
          echo "DCOS_SUPPLIER=${SUPPLIER:-champro}" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "MAX_ITEMS=${MAX_ITEMS:-25}" >> "$GITHUB_ENV"
          echo "Resolved: supplier=${SUPPLIER:-champro} dry_run=$DRY_RUN max_items=${MAX_ITEMS:-25}"
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=${DRY_RUN}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py
      - name: Run DCOS supplier backfill
        env:
          DCOS_KEY_ID: ${{ secrets.DCOS_KEY_ID }}
          DCOS_KEY_PASSWORD: ${{ secrets.DCOS_KEY_PASSWORD }}
          UPDATE_MAX_ITEMS: ${{ env.MAX_ITEMS }}
        run: python scripts/dcos_backfill.py
      - name: Open issue on failure
        if: failure()
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Workflow failed: ${{ github.workflow }} (${{ env.DCOS_SUPPLIER }})\",\"body\":\"Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
