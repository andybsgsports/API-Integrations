name: SanMar SFTP Host Key Probe (read-only)

# Prints the SanMar SFTP server's PUBLIC host key so it can be pinned in
# data/sanmar_sftp_host_key.b64. No login is made and NetSuite is not touched.
# Once a key is pinned, this also reports whether the server still matches it.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Read the server host key
        env:
          # from_env needs these to exist; the probe never logs in.
          SANMAR_SFTP_USERNAME: probe
          SANMAR_SFTP_PASSWORD: probe
        run: python scripts/sanmar_hostkey_probe.py
