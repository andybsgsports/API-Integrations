name: SanMar Key Back-fill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = report only, no NetSuite writes)"
        required: true
        default: "true"
      style_limit:
        description: "Only process the first N styles (0 = all)"
        required: false
        default: "200"
      max_items:
        description: "Cap on item writes (0 = no cap; use a small number for the first live run)"
        required: false
        default: "25"
      set_external_ids:
        description: "Also re-key external ids to SANMAR-<key> (overwrites migrated ids!)"
        required: false
        default: "false"
  # Bumping .backfill-trigger runs the back-fill with the parameters read from
  # that file's KEY=VALUE lines (DRY_RUN / STYLE_LIMIT / MAX_ITEMS /
  # SET_EXTERNAL_IDS) — an alternative to the Run-workflow button for
  # environments that can push but not dispatch. Scoped to the dev branch +
  # sentinel file so ordinary pushes never trigger it.
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".backfill-trigger"]

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve run parameters (inputs, or .backfill-trigger on push)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            get() { grep -E "^$1=" .backfill-trigger | tail -1 | cut -d= -f2- | tr -d ' \r'; }
            DRY_RUN=$(get DRY_RUN); STYLE_LIMIT=$(get STYLE_LIMIT)
            MAX_ITEMS=$(get MAX_ITEMS); SET_EXTERNAL_IDS=$(get SET_EXTERNAL_IDS)
          else
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            STYLE_LIMIT="${{ github.event.inputs.style_limit }}"
            MAX_ITEMS="${{ github.event.inputs.max_items }}"
            SET_EXTERNAL_IDS="${{ github.event.inputs.set_external_ids }}"
          fi
          # Fail safe: only an explicit "false" turns dry-run off.
          [ "$DRY_RUN" = "false" ] || DRY_RUN="true"
          echo "DRY_RUN=$DRY_RUN"            >> "$GITHUB_ENV"
          echo "STYLE_LIMIT=${STYLE_LIMIT:-200}" >> "$GITHUB_ENV"
          echo "MAX_ITEMS=${MAX_ITEMS:-25}"  >> "$GITHUB_ENV"
          echo "SET_EXTERNAL_IDS=${SET_EXTERNAL_IDS:-false}" >> "$GITHUB_ENV"
          echo "Resolved: dry_run=$DRY_RUN style_limit=${STYLE_LIMIT:-200} max_items=${MAX_ITEMS:-25} set_external_ids=${SET_EXTERNAL_IDS:-false}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF
          SANMAR_SFTP_USERNAME=${{ secrets.SANMAR_SFTP_USERNAME }}
          SANMAR_SFTP_PASSWORD=${{ secrets.SANMAR_SFTP_PASSWORD }}
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=${DRY_RUN}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF

      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py

      - name: Run key back-fill
        env:
          RECONCILE_STYLE_LIMIT: ${{ env.STYLE_LIMIT }}
          BACKFILL_MAX_ITEMS: ${{ env.MAX_ITEMS }}
          BACKFILL_SET_EXTERNAL_IDS: ${{ env.SET_EXTERNAL_IDS }}
        run: python scripts/backfill_keys.py
