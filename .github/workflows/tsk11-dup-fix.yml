name: TSK11 Duplicate Fix (one-off)

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = report only)"
        required: true
        default: "true"
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".tsk11-dup-fix-trigger"]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Resolve run parameters
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DRY_RUN=$(grep -E "^DRY_RUN=" .tsk11-dup-fix-trigger | tail -1 | cut -d= -f2 | tr -d ' \r')
          else
            DRY_RUN="${{ github.event.inputs.dry_run }}"
          fi
          [ "$DRY_RUN" = "false" ] || DRY_RUN="true"
          DIFF=$(grep -E "^DIFF=" .tsk11-dup-fix-trigger 2>/dev/null | tail -1 | cut -d= -f2 | tr -d ' \r')
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "TSK11_DIFF=${DIFF:-false}" >> "$GITHUB_ENV"
          echo "Resolved: dry_run=$DRY_RUN diff=${DIFF:-false}"

      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=${DRY_RUN}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2

      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py

      - name: Run TSK11 duplicate fix
        env:
          TSK11_DIFF: ${{ env.TSK11_DIFF }}
        run: python scripts/tsk11_dup_fix.py

      - name: Open issue on failure
        if: failure()
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Workflow failed: ${{ github.workflow }}\",\"body\":\"Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
