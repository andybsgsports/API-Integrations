name: SanMar Price Probe (read-only)

# Downloads the SanMar SDL + DIP feeds and prints every price field for one
# style, alongside what our cost logic computes. Read-only diagnostic -- no
# NetSuite writes. Triggered by editing .sanmar-price-probe-trigger.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Style number(s), comma-separated"
        required: true
        default: "DM130L"
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".sanmar-price-probe-trigger"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Resolve parameters (inputs, or trigger file on push)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            get() { grep -E "^$1=" .sanmar-price-probe-trigger | tail -1 | cut -d= -f2- | tr -d ' \r'; }
            echo "SANMAR_PROBE_STYLE=$(get STYLE)" >> "$GITHUB_ENV"
            echo "SANMAR_PROBE_COLOR=$(get COLOR)" >> "$GITHUB_ENV"
            echo "SANMAR_PROBE_SIZE=$(get SIZE)" >> "$GITHUB_ENV"
          else
            echo "SANMAR_PROBE_STYLE=${{ github.event.inputs.style }}" >> "$GITHUB_ENV"
          fi
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          SANMAR_SFTP_USERNAME=${{ secrets.SANMAR_SFTP_USERNAME }}
          SANMAR_SFTP_PASSWORD=${{ secrets.SANMAR_SFTP_PASSWORD }}
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: Run price probe
        run: python scripts/sanmar_price_probe.py
