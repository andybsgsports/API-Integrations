name: Web Display Field Probe (read-only, lightweight)

# Finds the exact "Display in Web Site" field name via the REST metadata
# catalog, then samples a few items against custitem_atlas_item_image. A
# handful of lightweight read calls -- not a bulk operation.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".web-display-probe-trigger"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: Run web display probe
        run: python scripts/web_display_probe.py
