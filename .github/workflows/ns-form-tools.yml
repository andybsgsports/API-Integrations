name: NS Form Tools (subtab assign + REST child test)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "subtab | childtest"
        required: true
        default: "subtab"
      dry_run:
        description: "Dry run"
        required: true
        default: "true"
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".ns-form-tools-trigger"]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Resolve params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            get() { grep -E "^$1=" .ns-form-tools-trigger | tail -1 | cut -d= -f2- | tr -d ' \r'; }
            TOOL=$(get TOOL); DRY_RUN=$(get DRY_RUN)
          else
            TOOL="${{ github.event.inputs.tool }}"; DRY_RUN="${{ github.event.inputs.dry_run }}"
          fi
          [ "$DRY_RUN" = "false" ] || DRY_RUN="true"
          echo "TOOL=${TOOL:-subtab}" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "Resolved: tool=${TOOL:-subtab} dry_run=$DRY_RUN"
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=${DRY_RUN}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: NetSuite auth preflight
        run: python scripts/ns_auth_check.py
      - name: Run tool
        run: |
          if [ "$TOOL" = "childtest" ]; then
            python scripts/dcos_child_rest_test.py
          else
            python scripts/ns_field_subtab.py
          fi
