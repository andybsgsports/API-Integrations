name: NS Field Max Value (per-warehouse qty fields)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = report only)"
        required: true
        default: "true"
      max_value:
        description: "Maximum value to set"
        required: false
        default: "50000"
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".ns-field-maxvalue-trigger"]

jobs:
  maxvalue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Resolve run parameters
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            get() { grep -E "^$1=" .ns-field-maxvalue-trigger | tail -1 | cut -d= -f2- | tr -d ' \r'; }
            DRY_RUN=$(get DRY_RUN)
            MAX_VALUE=$(get MAX_VALUE)
          else
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            MAX_VALUE="${{ github.event.inputs.max_value }}"
          fi
          [ "$DRY_RUN" = "false" ] || DRY_RUN="true"
          [ -n "$MAX_VALUE" ] || MAX_VALUE="50000"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "MAX_VALUE=$MAX_VALUE" >> "$GITHUB_ENV"
          echo "Resolved: dry_run=$DRY_RUN max_value=$MAX_VALUE"

      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=${DRY_RUN}
          MAX_VALUE=${MAX_VALUE}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2

      - name: Set warehouse field max value
        run: python scripts/ns_field_maxvalue.py
