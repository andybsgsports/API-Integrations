name: Production Vendor Pipeline (manual)

# Runs ONE vendor step against the PRODUCTION NetSuite account (11319665).
# Manual dispatch only: there is no schedule and no chain to the next vendor,
# and item-lifecycle is never started from here.
#
# Two modes:
#   dry_run (default) -- reports what it would add and change. The client is
#                        put in NETSUITE_READ_ONLY mode, so every request that
#                        could change NetSuite is refused before it is sent,
#                        whatever a script's own dry-run handling does.
#   live              -- writes. Needs confirm_live typed as LIVE, and the
#                        production matrix RESTlet ids.
#
# Production credentials are separate secrets (NETSUITE_PROD_*); the sandbox
# secrets and the sandbox nightly are untouched. See docs/PRODUCTION_CUTOVER.md.

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: "Vendor to run (sanmar, momentec, ua, ss, dcos, champro-csv)"
        required: true
        default: "sanmar"
      phases:
        description: "Comma-separated: discover,options,create,update"
        required: true
        default: "discover,options,create"
      mode:
        description: "dry_run = report only, nothing can be written. live = writes to PRODUCTION."
        required: true
        type: choice
        default: "dry_run"
        options:
          - dry_run
          - live
      confirm_live:
        description: "For live mode only: type LIVE"
        required: false
        default: ""
      create_max_styles:
        description: "Cap on NET-NEW styles created this run"
        required: false
        default: "25"
      max_items:
        description: "Cap on item writes"
        required: false
        default: "25"

# Production has its own queue: it must not wait behind, or be cancelled by,
# sandbox runs, and two production writers must never overlap.
concurrency:
  group: netsuite-writes-production
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Resolve run parameters
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm_live }}
          VENDOR_IN: ${{ github.event.inputs.vendor }}
          PHASES_IN: ${{ github.event.inputs.phases }}
          CREATE_MAX_IN: ${{ github.event.inputs.create_max_styles }}
          MAX_ITEMS_IN: ${{ github.event.inputs.max_items }}
          HAS_PROD_SECRETS: ${{ secrets.NETSUITE_PROD_ACCOUNT_ID != '' && secrets.NETSUITE_PROD_CONSUMER_KEY != '' && secrets.NETSUITE_PROD_CONSUMER_SECRET != '' && secrets.NETSUITE_PROD_TOKEN_ID != '' && secrets.NETSUITE_PROD_TOKEN_SECRET != '' }}
          HAS_MATRIX_IDS: ${{ (vars.NETSUITE_PROD_MATRIX_SCRIPT_ID != '' || secrets.NETSUITE_PROD_MATRIX_SCRIPT_ID != '') && (vars.NETSUITE_PROD_MATRIX_DEPLOY_ID != '' || secrets.NETSUITE_PROD_MATRIX_DEPLOY_ID != '') }}
        run: |
          if [ "$HAS_PROD_SECRETS" != "true" ]; then
            echo "::error::One or more NETSUITE_PROD_* secrets are missing. Add all five in Settings > Secrets and variables > Actions. Nothing was run."
            exit 1
          fi
          if [ "$MODE" = "live" ]; then
            if [ "$CONFIRM" != "LIVE" ]; then
              echo "::error::Live mode needs confirm_live typed as LIVE. Nothing was run."
              exit 1
            fi
            if [ "$HAS_MATRIX_IDS" != "true" ]; then
              echo "::error::Live mode needs NETSUITE_PROD_MATRIX_SCRIPT_ID and NETSUITE_PROD_MATRIX_DEPLOY_ID (repository variables or secrets). Nothing was run."
              exit 1
            fi
            DRY_RUN="false"; READ_ONLY="false"
          else
            # Anything that is not exactly "live" is a dry run.
            DRY_RUN="true"; READ_ONLY="true"
          fi
          {
            echo "VENDOR=$VENDOR_IN"
            echo "PHASES=$PHASES_IN"
            echo "DRY_RUN=$DRY_RUN"
            echo "READ_ONLY=$READ_ONLY"
            echo "CREATE_MAX_STYLES=${CREATE_MAX_IN:-25}"
            echo "MAX_ITEMS=${MAX_ITEMS_IN:-25}"
          } >> "$GITHUB_ENV"
          echo "PRODUCTION run: vendor=$VENDOR_IN phases=$PHASES_IN dry_run=$DRY_RUN "\
               "read_only=$READ_ONLY create_max=${CREATE_MAX_IN:-25} max_items=${MAX_ITEMS_IN:-25}"

      - name: Write .env from repo secrets (production NetSuite)
        run: |
          # NETSUITE_ALLOW_PRODUCTION_WRITES=true is what lets the client
          # CONNECT to a non-sandbox account at all (even to read). What stops
          # writes on a dry run is NETSUITE_READ_ONLY plus SYNC_DRY_RUN.
          cat > .env <<EOF2
          SANMAR_SFTP_USERNAME=${{ secrets.SANMAR_SFTP_USERNAME }}
          SANMAR_SFTP_PASSWORD=${{ secrets.SANMAR_SFTP_PASSWORD }}
          SS_API_ACCOUNT_NUMBER=${{ secrets.SS_API_ACCOUNT_NUMBER }}
          SS_API_KEY=${{ secrets.SS_API_KEY }}
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_PROD_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_PROD_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_PROD_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_PROD_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_PROD_TOKEN_SECRET }}
          NETSUITE_MATRIX_SCRIPT_ID=${{ vars.NETSUITE_PROD_MATRIX_SCRIPT_ID || secrets.NETSUITE_PROD_MATRIX_SCRIPT_ID }}
          NETSUITE_MATRIX_DEPLOY_ID=${{ vars.NETSUITE_PROD_MATRIX_DEPLOY_ID || secrets.NETSUITE_PROD_MATRIX_DEPLOY_ID }}
          SYNC_DRY_RUN=${DRY_RUN}
          NETSUITE_READ_ONLY=${READ_ONLY}
          NETSUITE_ALLOW_PRODUCTION_WRITES=true
          EOF2

      - name: Refuse to run against a sandbox account
        run: |
          python - <<'PY'
          from sanmar_netsuite.config import get_config
          cfg = get_config().netsuite
          if cfg.is_sandbox:
              raise SystemExit(
                  "NETSUITE_PROD_ACCOUNT_ID points at a sandbox account. This "
                  "workflow is for production only; use the nightly pipeline "
                  "for the sandbox. Nothing was run.")
          print(f"target: production; read_only={cfg.read_only}")
          PY

      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py

      - name: Download S&S catalog
        if: env.VENDOR == 'ss'
        run: ss-sync download

      - name: Run vendor pipeline
        env:
          UPDATE_MAX_ITEMS: ${{ env.MAX_ITEMS }}
          CREATE_MAX_STYLES: ${{ env.CREATE_MAX_STYLES }}
          DCOS_KEY_ID: ${{ secrets.DCOS_KEY_ID }}
          DCOS_KEY_PASSWORD: ${{ secrets.DCOS_KEY_PASSWORD }}
        run: |
          python scripts/vendor_pipeline.py \
            --vendor "$VENDOR" --phases "$PHASES"

      - name: Open issue on failure
        if: failure()
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Production pipeline failed: ${{ env.VENDOR }} (${{ github.event.inputs.mode }})\",\"body\":\"Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
