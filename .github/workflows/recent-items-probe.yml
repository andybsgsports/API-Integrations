name: Recent Items Probe (read-only)

# Lists items created in the last N hours -- verifies whether a CSV-import
# batch actually created records (the import task's COMPLETE status doesn't
# surface per-row rejects). Never writes.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Look-back window in hours"
        required: false
        default: "3"
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".recent-items-probe-trigger"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=true
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: Run probe
        env:
          RECENT_HOURS: ${{ github.event.inputs.hours }}
        run: python scripts/recent_items_probe.py
