name: SanMar Category Probe (read-only, SFTP only)

# Lists every distinct SanMar (category, subcategory) pair with SKU counts and
# flags which ones aren't mapped to a NetSuite Class -- used to build a
# complete Department/Class mapping. SFTP-only: does NOT touch NetSuite, so it
# is safe to run regardless of NetSuite account load.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".sanmar-category-probe-trigger"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Write .env from repo secrets (SFTP only)
        run: |
          cat > .env <<EOF2
          SANMAR_SFTP_USERNAME=${{ secrets.SANMAR_SFTP_USERNAME }}
          SANMAR_SFTP_PASSWORD=${{ secrets.SANMAR_SFTP_PASSWORD }}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: Run category probe
        run: python scripts/sanmar_category_probe.py
