name: DCOS Brand Entitlement Probe (read-only)

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".dcos-brand-probe-trigger"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Probe DCOS brand endpoints (read-only)
        env:
          DCOS_KEY_ID: ${{ secrets.DCOS_KEY_ID }}
          DCOS_KEY_PASSWORD: ${{ secrets.DCOS_KEY_PASSWORD }}
        run: python scripts/dcos_brand_probe.py
