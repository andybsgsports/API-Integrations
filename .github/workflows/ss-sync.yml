name: S&S Activewear Sync (dry-run)

# DRY-RUN ONLY for now: like SanMar, the migrated NetSuite catalog already
# carries S&S-sourced items, so writes stay off until the S&S reconcile pass
# (match by vendorname, back-fill keys) is done. This workflow proves the
# pipeline: S&S API auth -> full catalog download -> transform -> would-write
# report.
on:
  workflow_dispatch: {}
  # Bumping .ss-trigger runs the dry-run sync — an alternative to the
  # Run-workflow button for environments that can push but not dispatch.
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".ss-trigger"]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF
          SS_API_ACCOUNT_NUMBER=${{ secrets.SS_API_ACCOUNT_NUMBER }}
          SS_API_KEY=${{ secrets.SS_API_KEY }}
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=true
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF

      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py

      - name: S&S API auth check
        run: ss-sync test-auth

      - name: Full dry-run sync (download + catalog + pricing + inventory)
        run: ss-sync all

      - name: Upload downloaded catalog (debug aid, 7-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss-sync-downloads-${{ github.run_id }}
          path: downloads/ss/
          retention-days: 7
          if-no-files-found: ignore
