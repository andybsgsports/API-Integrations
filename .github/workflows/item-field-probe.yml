name: Item Field Probe (read-only)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      items:
        description: "Comma list of item names to dump"
        required: false
        default: ""
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".item-field-probe-trigger"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Resolve items
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v=$(grep -E '^ITEMS=' .item-field-probe-trigger | tail -1 | cut -d= -f2-)
          else
            v="${{ github.event.inputs.items }}"
          fi
          echo "ITEM_PROBE=${v}" >> "$GITHUB_ENV"
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=true
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: Run item field probe (read-only)
        run: python scripts/item_field_probe.py
