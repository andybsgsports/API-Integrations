name: Sandbox Create Dry Run (read-only)

# Reports what a vendor's CREATE step would add in the sandbox, and writes
# nothing: SYNC_DRY_RUN and NETSUITE_READ_ONLY are both forced on, so the
# client refuses any request that could change NetSuite before it is sent.
#
# Deliberately NOT in the netsuite-writes concurrency group. GitHub keeps only
# one pending run per group, so a queued dry run is cancelled when the nightly
# chain dispatches its next step (that cost the S&S preview a run on
# 2026-08-10). A read-only run can safely overlap the writers.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: "Vendor (momentec or ss)"
        required: true
        default: "momentec"
      create_max_styles:
        description: "Cap on NET-NEW styles reported (0 = no cap)"
        required: false
        default: "0"
      max_items:
        description: "Cap on children under existing parents (0 = no cap)"
        required: false
        default: "0"
      styles:
        description: "Momentec only: comma-separated style numbers to limit the run to (blank = all)"
        required: false
        default: ""

concurrency:
  group: sandbox-create-dry-run-${{ github.event.inputs.vendor }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write .env from repo secrets (sandbox, read-only)
        run: |
          cat > .env <<EOF2
          SS_API_ACCOUNT_NUMBER=${{ secrets.SS_API_ACCOUNT_NUMBER }}
          SS_API_KEY=${{ secrets.SS_API_KEY }}
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          NETSUITE_MATRIX_SCRIPT_ID=${{ secrets.NETSUITE_MATRIX_SCRIPT_ID }}
          NETSUITE_MATRIX_DEPLOY_ID=${{ secrets.NETSUITE_MATRIX_DEPLOY_ID }}
          SYNC_DRY_RUN=true
          NETSUITE_READ_ONLY=true
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2

      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py

      - name: Download S&S catalog
        if: github.event.inputs.vendor == 'ss'
        run: ss-sync download

      - name: Report what creation would add
        env:
          CREATE_MAX_STYLES: ${{ github.event.inputs.create_max_styles || '0' }}
          UPDATE_MAX_ITEMS: ${{ github.event.inputs.max_items || '0' }}
          MOMENTEC_CREATE_STYLES: ${{ github.event.inputs.styles }}
          VENDOR_IN: ${{ github.event.inputs.vendor }}
        run: |
          case "$VENDOR_IN" in
            momentec) PHASES="create" ;;
            ss)       PHASES="discover,create" ;;
            *) echo "::error::vendor must be momentec or ss"; exit 1 ;;
          esac
          python scripts/vendor_pipeline.py --vendor "$VENDOR_IN" --phases "$PHASES"
