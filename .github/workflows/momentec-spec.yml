name: Momentec discovery fetch

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".momentec-trigger"]

jobs:
  fetch-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Momentec product-data page and API page (read-only)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"
          for u in \
            "https://resources.momentecbrands.com/en_us/product-data-BkpahHBvlx" \
            "https://resources.momentecbrands.com/en_us/api-and-edi-H1vRsrHDex"; do
            echo "===================== $u ====================="
            curl -sSL -A "$UA" --max-time 40 "$u" -o page.html || { echo "(fetch failed)"; continue; }
            python3 - <<'PY'
          import re, html
          raw = open('page.html', encoding='utf-8', errors='replace').read()
          txt = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', raw, flags=re.S|re.I)
          txt = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', txt)))
          print("--- PAGE TEXT ---"); print(txt[:6000])
          print("--- LINKS (feeds/api/csv/ftp/json) ---")
          for l in dict.fromkeys(re.findall(r'href="([^"]+)"', raw)):
              if any(k in l.lower() for k in ('feed','csv','ftp','api','json','data','xls')):
                  print(l)
          PY
          done
