name: Item Lifecycle (auto-inactivate discontinued)

permissions:
  contents: read
  issues: write

on:
  # No cron of its own: since 2026-08-10 (Andy approved the dry-run report)
  # this runs as the FINAL leg of the nightly chain -- nightly-pipeline.yml's
  # champro-csv step dispatches it, so it always fires after every vendor has
  # restamped its feed heartbeats. Manual dispatch still works.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = report only)"
        required: true
        default: "true"
      max_items:
        description: "Cap on item flips (0 = no cap)"
        required: false
        default: "25"
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".item-lifecycle-trigger"]

# All NetSuite item-writers share one concurrency group so they QUEUE
# instead of running at once -- the sandbox throttles hard (429s) when
# multiple writers overlap. cancel-in-progress:false = wait, don't kill.
concurrency:
  group: netsuite-writes
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Resolve run parameters
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            get() { grep -E "^$1=" .item-lifecycle-trigger | tail -1 | cut -d= -f2- | tr -d ' \r'; }
            DRY_RUN=$(get DRY_RUN); MAX_ITEMS=$(get MAX_ITEMS)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            DRY_RUN="false"; MAX_ITEMS="0"
          else
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            MAX_ITEMS="${{ github.event.inputs.max_items }}"
          fi
          [ "$DRY_RUN" = "false" ] || DRY_RUN="true"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "MAX_ITEMS=${MAX_ITEMS:-25}" >> "$GITHUB_ENV"
          echo "Resolved: dry_run=$DRY_RUN max_items=${MAX_ITEMS:-25}"

      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=${DRY_RUN}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2

      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py

      - name: Run item lifecycle
        env:
          UPDATE_MAX_ITEMS: ${{ env.MAX_ITEMS }}
        run: python scripts/item_lifecycle.py

      - name: Open issue on failure
        if: failure()
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Workflow failed: ${{ github.workflow }}\",\"body\":\"Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
