name: SanMar Ensure Matrix Values (colors/sizes the import needs)

# Reconciles the colour/size names the create-import couldn't resolve against the
# live matrix lists: creates the genuinely-new values, and flags spelling variants
# of existing values (so we remap, not duplicate). Reads data/sanmar_missing_*.txt.
# Dry-run reports the split + writes the plans; live (DRY_RUN=false) creates.

permissions:
  contents: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = report only)"
        required: true
        default: "true"
      create_max:
        description: "Cap on colour creates (0 = no cap)"
        required: false
        default: "0"
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".sanmar-ensure-values-trigger"]

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Resolve run parameters (inputs, or trigger file on push)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            get() { grep -E "^$1=" .sanmar-ensure-values-trigger | tail -1 | cut -d= -f2- | tr -d ' \r'; }
            DRY_RUN=$(get DRY_RUN); CREATE_MAX=$(get CREATE_MAX)
          else
            DRY_RUN="${{ github.event.inputs.dry_run }}"; CREATE_MAX="${{ github.event.inputs.create_max }}"
          fi
          [ "$DRY_RUN" = "false" ] || DRY_RUN="true"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "CREATE_MAX=${CREATE_MAX:-0}" >> "$GITHUB_ENV"
          echo "Resolved: dry_run=$DRY_RUN create_max=${CREATE_MAX:-0}"
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=${DRY_RUN}
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py
      - name: Run ensure matrix values
        env:
          CREATE_MAX: ${{ env.CREATE_MAX }}
        run: |
          set -o pipefail
          python scripts/sanmar_ensure_matrix_values.py | tee sanmar_ensure_values.txt
      - name: Commit plans back to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp sanmar_ensure_values.txt data/ 2>/dev/null || true
          git add -f data/sanmar_color_plan.csv data/sanmar_size_plan.csv data/sanmar_ensure_values.txt 2>/dev/null || true
          git commit -m "SanMar ensure-values plan (run ${{ github.run_id }}) [skip ci]" || exit 0
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || echo "push failed - report in log only"
      - name: Open issue on failure
        if: failure()
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Workflow failed: ${{ github.workflow }}\",\"body\":\"Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
