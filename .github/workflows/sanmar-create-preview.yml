name: SanMar Create Preview (what's missing, read-only)

# Reads today's SanMar feed + the live NetSuite catalog and reports what CSV
# auto-create would ADD -- new colours/sizes under existing parents (written to
# data/sanmar_new_children.csv, import-ready) vs styles NetSuite doesn't carry
# at all (data/sanmar_new_parents.txt, need a parent record first). Read-only:
# no NetSuite writes, safe on every run. This produces the sample CSV the
# operator builds/validates the saved import map against (docs/CSV_AUTOCREATE.md).

permissions:
  contents: write

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/festive-carson-oj4y8n"]
    paths: [".sanmar-create-preview-trigger"]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Write .env from repo secrets
        run: |
          cat > .env <<EOF2
          SANMAR_SFTP_USERNAME=${{ secrets.SANMAR_SFTP_USERNAME }}
          SANMAR_SFTP_PASSWORD=${{ secrets.SANMAR_SFTP_PASSWORD }}
          NETSUITE_ACCOUNT_ID=${{ secrets.NETSUITE_ACCOUNT_ID }}
          NETSUITE_CONSUMER_KEY=${{ secrets.NETSUITE_CONSUMER_KEY }}
          NETSUITE_CONSUMER_SECRET=${{ secrets.NETSUITE_CONSUMER_SECRET }}
          NETSUITE_TOKEN_ID=${{ secrets.NETSUITE_TOKEN_ID }}
          NETSUITE_TOKEN_SECRET=${{ secrets.NETSUITE_TOKEN_SECRET }}
          SYNC_DRY_RUN=true
          NETSUITE_ALLOW_PRODUCTION_WRITES=false
          EOF2
      - name: NetSuite auth preflight (no secrets printed)
        run: python scripts/ns_auth_check.py
      - name: Run create preview (read-only)
        run: |
          set -o pipefail
          python scripts/sanmar_create_preview.py | tee sanmar_create_preview.txt
      # The full child CSV is ~30 MB and over the Import Assistant's 25k-line
      # limit, so it is NOT committed (data/ is gitignored). The importable
      # <25k-line PARTS + the full file ship as a downloadable run artifact.
      - name: Upload importable CSV parts (artifact, 14-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanmar-new-children-${{ github.run_id }}
          path: |
            data/sanmar_new_children_part*.csv
            data/sanmar_new_children.csv
          retention-days: 14
          if-no-files-found: warn
      - name: Commit lightweight report + parent list back to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data && cp sanmar_create_preview.txt data/ 2>/dev/null || true
          # Only the small text report + parent-style list are committed; the
          # large CSVs go to the run artifact above.
          git add -f data/sanmar_new_parents.txt data/sanmar_create_preview.txt 2>/dev/null || true
          git commit -m "SanMar create preview (run ${{ github.run_id }}) [skip ci]" || exit 0
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || echo "push failed - report in log only"
